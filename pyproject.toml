[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enhancoai"
version = "0.1.0"
description = "Deep learning, molecular dynamics and AI analysis of transcription-factor cooperativity and DNA-mediated allostery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EnhancoAI Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "PyYAML>=6.0",
    "MDAnalysis>=2.5",
    "biopython>=1.81",
    "PySide6>=6.5",
    "matplotlib>=3.7",
    "networkx>=3.1",
    "click>=8.1",
    "jinja2>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
full = ["biotite>=0.38", "pyvista>=0.42", "pyvistaqt>=0.11", "torch_geometric>=2.4"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "black>=24.0", "mypy>=1.8", "pre-commit>=3.6"]

[project.scripts]
enhancoai = "enhancoai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.black]
line-length = 110
target-version = ["py310"]
